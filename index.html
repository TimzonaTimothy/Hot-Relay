<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1116" />
    <meta name="description" content="Hot Relay — tag-team run-and-gun prototype. Plays offline." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Hot Relay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1116;
        overflow: hidden;
      }
      body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        color: #e8e2d4;
        font:
          600 18px/1.4 system-ui,
          sans-serif;
        text-align: center;
        background: #0e1116;
        padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8b93a1;
        font:
          14px system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="boot">Loading…</div>
    <div id="game"></div>
    <div id="rotate">Turn your phone sideways to play</div>
    <noscript>Hot Relay needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
